name: CI Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: mehulsri07

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install & Build Frontend
        run: |
          npm ci
          npm run build

      - name: Install & Check Backend
        working-directory: ./backend
        run: |
          npm ci
          node --check server.js

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend Image
        run: |
          docker build \
            -t ghcr.io/${{ env.OWNER }}/stratadesk-backend:${{ github.sha }} \
            -t ghcr.io/${{ env.OWNER }}/stratadesk-backend:latest \
            ./backend

      - name: Build Frontend Image
        run: |
          docker build \
            -t ghcr.io/${{ env.OWNER }}/stratadesk-frontend:${{ github.sha }} \
            -t ghcr.io/${{ env.OWNER }}/stratadesk-frontend:latest \
            -f Dockerfile.frontend.prod .

      - name: Start Full Stack
        run: docker compose up -d

      - name: Wait For Backend
        run: |
          for i in $(seq 1 24); do
            if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "Backend ready"
              exit 0
            fi

            echo "Attempt $i/24 - waiting 5s..."
            sleep 5
          done

          echo "Backend failed to start"

          docker logs stratadesk-postgres
          docker logs stratadesk-backend

          exit 1

      - name: Test Backend API
        run: curl -sf http://localhost:3001/api/borewells

      - name: Test Frontend
        run: |
          response=$(curl -s http://localhost:80)
          echo "$response"
          echo "$response" | grep -i "<html"

      - name: Push Images
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ env.OWNER }}/stratadesk-backend:${{ github.sha }}
          docker push ghcr.io/${{ env.OWNER }}/stratadesk-backend:latest

          docker push ghcr.io/${{ env.OWNER }}/stratadesk-frontend:${{ github.sha }}
          docker push ghcr.io/${{ env.OWNER }}/stratadesk-frontend:latest

      - name: Dump Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v