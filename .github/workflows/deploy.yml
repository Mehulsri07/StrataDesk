name: Deploy to EC2

on:
  workflow_run:
    workflows:
      - "CI Pipeline"
    branches:
      - main
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/stratadesk

            docker login ghcr.io \
              -u ${{ github.actor }} \
              -p ${{ secrets.GITHUB_TOKEN }}

            docker compose pull

            docker compose up -d

            docker image prune -f

            docker ps